# Tests on every push to main, on Windows and Ubuntu (tz.md, п. 9.3). Runs in the background:
# the result is the mark next to the commit on GitHub. Before a commit the same tests run locally.
# Integration tests that need the user's own photos and videos are skipped here (make-project.md, п. 7).
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'release-notes/**', 'LICENSE']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: exiftool
        shell: bash
        run: bash scripts/ci-exiftool.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
