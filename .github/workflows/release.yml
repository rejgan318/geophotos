# The release (tz.md, п. 9.3): pushing a tag vX.Y.Z builds the program in GitHub's cloud, tests it,
# packs the zip, attests its origin (check: gh attestation verify <zip> --repo rejgan318/geophotos)
# and creates a DRAFT release with release-notes/X.Y.Z.md and the SHA-256. The draft is checked and
# published by hand.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Tag, version and release notes agree
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, but package.json has $version" >&2; exit 1
          fi
          test -s "release-notes/$version.md" || { echo "No release-notes/$version.md" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - name: exiftool
        shell: bash
        run: bash scripts/ci-exiftool.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run pack:zip
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/GeoPhotos-Setup-${{ env.VERSION }}.exe
            dist/GeoPhotos-${{ env.VERSION }}-win-x64.zip
      # The installer, the zip, and what the updater of installed programs reads (tz.md, п. 2.5):
      # latest.yml (the version and SHA-512 of the installer) and the blockmap (to download only
      # what changed). The zip version reads the version from latest.yml too.
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          setup="dist/GeoPhotos-Setup-$VERSION.exe"
          zip="dist/GeoPhotos-$VERSION-win-x64.zip"
          sha() { sha256sum "$1" | cut -d' ' -f1 | tr a-f A-F; }
          notes="$RUNNER_TEMP/notes.md"
          cat "release-notes/$VERSION.md" > "$notes"
          {
            printf '\nSHA-256:\n'
            printf -- '- `%s`: `%s`\n' "$(basename "$setup")" "$(sha "$setup")"
            printf -- '- `%s`: `%s`\n' "$(basename "$zip")" "$(sha "$zip")"
            printf '\nBuilt by GitHub Actions from tag `%s`; check the origin of a file: `gh attestation verify <file> --repo %s`\n' \
              "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
          } >> "$notes"
          gh release create "$GITHUB_REF_NAME" "$setup" "$zip" dist/latest.yml "$setup.blockmap" \
            --draft --verify-tag --title "GeoPhotos $VERSION" --notes-file "$notes"
